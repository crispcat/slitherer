# Ingestion pipeline configuration.
# All prompts, thresholds, batch sizes, and mode switches for the vision-based ingestion pipeline.
# Model bindings are configured in worker/wrangler.toml (not here).

vision:
  maxTokens:
    value: 16000
    description: >-
      Maximum output tokens for vision extraction. 16K is enough for dense pages
      with multiple tables. Increase if pages get truncated.
    file: pipeline/vision_extract.ts

  pagesPerCall:
    value: 1
    description: >-
      Number of pages per API call. 1 = single page (default, simplest to debug).
      Can be increased to 2 or 4 for fewer calls, but attention may degrade.
    file: pipeline/vision_extract.ts

  temperature:
    value: 0
    description: >-
      Temperature for vision extraction. 0 for reproducibility — same page always
      produces the same structure. The model does structural reasoning (table tree
      decisions), but consistency is more valuable than creativity here.
    file: pipeline/vision_extract.ts

  continuationContainerCount:
    value: 4
    description: >-
      Number of recent container units (units that had children) to pass to the
      next page via VisionContinuation. Each entry includes the container's name
      and content. Handles cross-page parent linking for tables spanning multiple
      pages and parallel lists split across page breaks.
    file: pipeline/vision_extract.ts

  prompt:
    description: System prompt for vision-based semantic unit extraction (Phase 3)
    file: pipeline/vision_extract.ts
    text: |-
      You are a precise data extraction engine. You receive a page image from a tabletop RPG rulebook PDF. Your job is to extract the content into a structured JSON tree of "semantic units" — fine-grained, individually retrievable pieces of rules content.

      You may receive continuation context from the previous page. Use it to:
      - Continue the current section path if no new heading appears on this page.
      - Complete a unit that was truncated at the bottom of the previous page.
      - Link the first unit on this page to the correct parent from the previous page.

      OUTPUT FORMAT — Return ONLY a JSON object:
      {
        "units": [
          {
            "type": "Rule",
            "name": "Контроль",
            "content": "...",
            "parentName": null,
            "section": ["II. КРАСНОЕ ЗОЛОТО", "2.1. Создание персонажа"]
          }
        ]
      }

      UNIT TYPES (6 types):
      - "Rule" — any retrievable piece of rules content. This is the default for ALL content: abilities, spells, weapons, traits, actions, definitions, modifiers, examples, category labels, etc. A Rule has a name (the label/term) and content (the full text). A Rule can also serve as a container — if it has children but no content of its own, it's a category label grouping related items (e.g. "Основные:" with perks as children, or a "Disadvantages" column header with traits as children).
      - "DataTableHeader" — header of a true/simple data table where each row is one entity and columns describe properties of that entity (e.g. a weapon table where each row has damage | type | requirements | weight). The header is a "DataTableHeader" unit, each row is a "DataTableRow" child. Only use "DataTableHeader" for actual data tables where columns describe properties of the same entity in each row.
      - "DataTableRow" — one data row/entity under a DataTableHeader. Each row is a separate unit, child of the DataTableHeader.
      - "ColumnListTable" — a structural layout where columns are independent lists of unrelated items (e.g. Weapons on the left, Spells on the right; or Advantages/Disadvantages side by side). Row N on the left has no relationship to row N on the right. The container is a "ColumnListTable" unit, and each column's items are "ColumnListItem" children.
      - "ColumnListItem" — an item belonging to a ColumnListTable. Each item is a separate unit, child of the ColumnListTable.
      - "Image" — a visual element that carries rules information (diagrams, charts, battlefield maps, illustrated tables). The "name" is a short label for the visual, and the "content" is a comprehensive text description of what the visual shows and how it relates to the rules. This text will be embedded for retrieval, so it must be detailed enough to answer questions about the visual. Do NOT create Image units for purely decorative elements (borders, logos, ornamental art).

      GRANULARITY RULES:
      1. Each unit should be ONE retrievable concept. A paragraph about one mechanic = one unit. A numbered perk = one unit. A table row = one unit. A bullet = one unit.
      2. Split freely at any structural boundary: paragraphs, bullets, numbered items, bold labels, table rows, table cells, or any visual grouping. It is better to over-split than to merge unrelated content.
      3. For data tables (type "DataTableHeader"): each ROW is a separate "DataTableRow" unit, child of the table header. If a table is a list of entities of the same type (e.g. Weapons, Spells), each entity is a "DataTableRow" child of the "DataTableHeader".
      4. For independent column lists (type "ColumnListTable"): if a layout has two or more columns that are unrelated lists (NOT a data table — row N on the left has no relationship to row N on the right, e.g. "Disadvantages" and "Advantages" side by side), extract the container as a "ColumnListTable" unit with the column label as "name", and each item in that column as a "ColumnListItem" child.
      5. Numbered or bulleted items are each separate units, children of the introducing unit.
      6. Bold-label definitions (e.g. "**Контроль (К)** — отражает ресурс...") get their own unit with the label as "name".
      7. Do NOT create units for: page numbers, headers/footers, table of contents entries, decorative text.

      NAMING RULES — critical for parent-child linking:
      - Every unit MUST have a unique "name" within the page. If two units would have the same name, differentiate them (e.g. "КК – Шило" for the container and "КК – Шило: характеристики" for the stats, or append a suffix like "-2" for the second occurrence).
      - The "name" is used by child units to reference this unit via "parentName". If names are not unique, parent linking will be ambiguous.
      - A container unit (one that has children but no content of its own) should have a descriptive name (e.g. "Стержни", "Основные:", "Недостатки").

      PARENT-CHILD HIERARCHY — the most important part:
      - A section heading introduces a group of rules → those rules are children of the heading.
      - A rule that introduces a list → list items are children of that rule.
      - A definition → its modifiers/exceptions are children.
      - A table → its rows are children (DataTableHeader → DataTableRow, ColumnListTable → ColumnListItem).
      - "parentName" is the "name" of the parent unit. Root units have parentName: null.
      - The parent must be a unit that appears BEFORE this unit in the output (you cannot reference a unit you haven't output yet).
      - IMPORTANT: parentName must NEVER be the unit's own name. If a unit has no parent, use null.
      - If multiple units share the same name, parentName refers to the most recent one that appeared before this unit.

      CONTENT PRESERVATION:
      - Preserve the original text exactly, including formatting markers like **bold**, numbers, and punctuation.
      - For table rows, format as markdown: | col1 | col2 |
      - Include the full text of each unit — do not summarize or truncate.
      - If text spans multiple lines, join them with spaces (unless it's a list item).

      SECTION PATH:
      - "section" is the full path of numbered headings from the start of the document down to the current section. It represents the book's structural organization, NOT the text's internal structure.
      - It is an array of strings, starting with the top-level chapter heading, then each nested subsection heading: [chapter, section, subsection, ...]. Always include the COMPLETE path — never just the deepest heading.
      - Example: a unit under "4.6. ДОМ СВЕТА" which is under "4. МАГИЯ" should have section: ["4. МАГИЯ", "4.6. ДОМ СВЕТА"], NOT just ["4.6. ДОМ СВЕТА"].
      - Only include numbered headings that are part of the book's chapter/section hierarchy. Do NOT include table headers, sub-table labels, or content groupings as section paths — those are represented by parent-child relationships (parentName), not by section paths.
      - You may not see all parent headings on the current page. Use the continuation context's sectionPath as the base, and replace/extend it with any new headings you see on this page. For example, if continuation says ["4. МАГИЯ"] and you see "4.6. ДОМ СВЕТА" on this page, the path is ["4. МАГИЯ", "4.6. ДОМ СВЕТА"].
      - If no new numbered heading appears on this page, use the continuation context's sectionPath as-is.
      - If you can't determine the section and no continuation context is available, use an empty array [].

      PAGE NUMBER:
      - The page number will be set by the calling system. You can omit it or set it to null.

      CONTINUATION CONTEXT:
      - If continuation context is provided, the "sectionPath", "lastUnitName", "lastUnitContent", and "lastContainers" from the previous page are given in the user message.
      - lastUnitName / lastUnitContent: the last unit from the previous page. If this page starts with a continuation of that unit (e.g. a sentence cut off), merge it by setting parentName to lastUnitName.
      - lastContainers: up to N recent container units (units that had children) from previous pages, each with their name and content. If this page starts with table rows, list items, or category entries that belong to a container from a previous page, set parentName to the matching container name from this list.
      - Do NOT include a "continuation" field in your output. The system computes continuation state deterministically from your extracted units.

      Return ONLY the JSON object with "units" and "images" arrays. No explanations, no markdown fences.

embedding:
  maxTokens:
    value: 6000
    description: >-
      Maximum tokens for embedding document (bge-m3 supports 8192, we leave headroom)
    file: pipeline/embeddings.ts

  bytesPerToken:
    value: 2.5
    description: Bytes per token estimation factor for token budget checking
    file: pipeline/embeddings.ts

ingestion:
  batchSizes:
    summary:
      value: 2
      description: Batch size cap for Phase 3a summary generation (LLM calls are expensive)
      file: pipeline/ingest.ts

    metadata:
      value: 2
      description: Batch size cap for Phase 3b metadata extraction (LLM calls are expensive)
      file: pipeline/ingest.ts

    embedding:
      value: 5
      description: >-
        Batch size cap for the embedding phase (subject + content embeddings per unit).
        Embedding API calls are batched but still rate-limited.
      file: pipeline/ingest.ts

    concepts:
      value: 2
      description: >-
        Batch size cap for the concepts phase (concept extraction + resolution per unit).
        Each unit may trigger multiple LLM calls for description generation and validation.
      file: pipeline/ingest.ts

  conceptVectorThreshold:
    value: 0.55
    description: >-
      Minimum vector similarity score for concept resolution candidates.
      Lowered from 0.75 to catch more candidates — the LLM validation step
      filters out false positives. Lower values mean more LLM validation calls
      but fewer missed concept matches.
    file: pipeline/concepts.ts

  conceptVectorTopK:
    value: 5
    description: >-
      Number of concept candidates to retrieve from the concept Vectorize index
      for each unresolved mention. Higher values mean more candidates to
      validate via LLM but better coverage.
    file: pipeline/concepts.ts

parentContext:
  childrenMaxChars:
    value: 3000
    description: >-
      Aggregate children content length guard for summary prompts. Children
      names (never content) are included only if the total children content
      is under this threshold. If exceeded, children context is skipped
      entirely to avoid flooding the prompt for large lists/tables.
    file: pipeline/summary.ts

fallbackSummaryLength:
  value: 240
  description: Character length of fallback summary (content slice) when LLM fails
  file: pipeline/summary.ts

llm:
  jsonTemperature:
    value: 0
    description: Temperature for JSON mode LLM calls (deterministic)
    file: utils/llm.ts

  textTemperature:
    value: 0.2
    description: Temperature for text generation LLM calls (low creativity)
    file: utils/llm.ts

  defaultMaxRetries:
    value: 2
    description: Default retry count for LLM calls
    file: utils/llm.ts

prompts:
  summary:
    description: System prompt for Phase 3a summary generation (extraction model)
    file: pipeline/summary.ts
    text: |-
      You are a rules-analysis engine for a tabletop RPG rulebook (Russian language).
      Given a semantic unit with its name, content, parent name, and children names,
      generate a short concise summary of what the unit says.

      The unit's OWN name and content take PRECEDENCE over the parent and children
      context. The summary should primarily describe what this unit itself says.
      Use the parent name and children names only as framing context — to understand
      where this unit sits in the hierarchy — not as the subject of the summary.

      Respond with ONLY a JSON object of the form:
      {"summary": "one to three sentence plain-language summary of this unit"}

      Keep the original language (Russian) for the summary.

  metadata:
    description: System prompt for Phase 3b metadata extraction (reasoning model)
    file: pipeline/metadata.ts
    text: |-
      You are a rules-analysis engine for a tabletop RPG rulebook (Russian language).
      Given a single semantic unit (name, summary, content), extract structured metadata about it.

      Extract these fields. Each field is a list of named mechanics, terms, or concepts.
      Only extract relationships that are explicitly present in the unit's own text or
      clearly implied by its content.
      - defines: terms/mechanics/concepts that this unit DEFINES — i.e. this unit provides
        the authoritative definition or primary explanation of what the term means and how
        it works. A unit should only define a term if it is the primary source of rules for
        that term.
      - mentions: terms/mechanics/concepts that this unit references, requires, modifies,
        or otherwise relates to — i.e. the unit uses or interacts with these concepts but
        does not define them. This includes prerequisites, exceptions, modifications,
        references, and any other relationship where the term is mentioned but not defined.

      Also extract:
      - aliases: alternate names/synonyms for this unit, if any

      Respond with ONLY a JSON object of the form:
      {"defines": ["..."], "mentions": ["..."], "aliases": ["..."]}
      All arrays contain strings. Only use information present in the text.
      Use empty arrays where nothing applies.
      Keep the original language (Russian) for all extracted strings.
