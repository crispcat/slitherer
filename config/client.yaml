# Client (Cloudflare Pages) configuration.
# UI defaults, API connection, and feature switches.

api:
  baseUrl:
    value: https://slitherer-rag.slitherer.workers.dev
    description: Hardcoded API base URL. Not user-editable in the UI.
    file: client/api.js

  authStorageKey:
    value: slitherer_rag_auth
    description: localStorage key for storing the API token after login
    file: client/ui.js

ui:
  defaultRequestMode:
    value: staged
    description: >-
      Default request mode — 'staged' (step-by-step) or 'full' (all-in-one)
    file: client/index.html

  defaultStream:
    value: true
    description: >-
      Default streaming mode — true for SSE token streaming, false for complete
      JSON response
    file: client/index.html

  defaultDebug:
    value: true
    description: Default debug mode — true shows intermediate steps and debug info
    file: client/index.html

  defaultGraphHops:
    value: 2
    description: >-
      Default semantical net width (graph expansion hops).
      Labeled 'Semantical Net Width' in UI.
    file: client/index.html
    min: 0
    max: 4

  defaultMaxIterations:
    value: 3
    description: >-
      Default thinking level (max retrieval iterations).
      Labeled 'Thinking Level' in UI.
    file: client/index.html
    min: 1
    max: 5

  assistantName:
    value: SLITHERER
    description: Display name for the assistant in chat messages
    file: client/ui.js

  assistantBadge:
    value: S
    description: Single-letter badge for the assistant in chat messages
    file: client/ui.js

  userBadge:
    value: U
    description: Single-letter badge for the user in chat messages
    file: client/ui.js

features:
  tabbedChat:
    enabled: true
    description: >-
      Multiple chat tabs with independent conversations.
      New Chat creates a tab, tabs can be closed.
    file: client/ui.js

  loginGate:
    enabled: true
    description: >-
      Login screen shown until API token is verified.
      Token stored in localStorage for auto-login.
    file: client/ui.js

  streaming:
    enabled: true
    description: >-
      SSE token streaming for interactive UI.
      Also supports complete mode for bot integrations.
    file: client/api.js, client/ui.js

  debugOutput:
    enabled: true
    description: >-
      Debug info (sub-queries, sufficiency decisions, retrieved units) shown
      when debug=true
    file: client/ui.js

  thinkingBlocks:
    enabled: true
    description: >-
      Expandable greyed-out intermediate step blocks
      (router, decompose, retrieve, sufficiency, answer)
    file: client/ui.js

  conversationHistory:
    enabled: true
    description: >-
      Server-side conversation storage in D1.
      Client sends conversationId with each request.
    file: client/api.js

cors:
  allowOrigin:
    value: '*'
    description: CORS Access-Control-Allow-Origin header value
    file: worker/src/index.ts

  allowHeaders:
    value: authorization, content-type
    description: CORS Access-Control-Allow-Headers header value
    file: worker/src/index.ts

  allowMethods:
    value: GET, POST, OPTIONS
    description: CORS Access-Control-Allow-Methods header value
    file: worker/src/index.ts

  maxAge:
    value: 86400
    description: CORS preflight cache duration in seconds (24 hours)
    file: worker/src/index.ts
