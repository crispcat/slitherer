# Retrieval pipeline configuration.
# All prompts, thresholds, and mode switches for the agentic retrieval
# pipeline (router → decompose → retrieve → sufficiency loop → answer).
# Model bindings are configured in worker/wrangler.toml (not here).

pipeline:
  historyTurns:
    value: 6
    description: >-
      Number of conversation turns (3 user + 3 assistant) passed to router and
      decomposer for context
    file: retrieval/pipeline.ts

  maxIterations:
    value: 3
    description: >-
      Maximum retrieval iterations for simple queries (initial + 1 follow-up).
      Phase 9: Complex queries use maxComplexIterations instead.
    file: retrieval/pipeline.ts

  maxComplexIterations:
    value: 5
    description: >-
      Phase 9: Maximum retrieval iterations for complex queries (e.g. character creation).
      Complex queries use iterative retrieval as the primary gathering mechanism.
    file: retrieval/pipeline.ts

  streamingChunkSize:
    value: 50
    description: >-
      Character chunk size for simulated streaming (when Workers AI doesn't
      support true token streaming)
    file: retrieval/pipeline.ts, retrieval/answer.ts

retrieval:
  subjectTopK:
    value: 15
    description: >-
      Phase 4: Top-K results from subject Vectorize search per subquery.
      Subject embeddings capture "what is this unit about" — good for semantic discovery.
    file: retrieval/query.ts

  contentTopK:
    value: 15
    description: >-
      Phase 4: Top-K results from content Vectorize search per subquery.
      Content embeddings capture exact rule text — good for precise retrieval.
    file: retrieval/query.ts

  lexicalTopK:
    value: 15
    description: >-
      Phase 4: Top-K results from FTS5 lexical search per subquery.
      Lexical search catches exact term matches that vector search may miss.
    file: retrieval/query.ts

  rrfK:
    value: 60
    description: >-
      Phase 4: RRF (Reciprocal Rank Fusion) constant.
      k=60 is the standard value — balances rank vs. score dominance.
    file: retrieval/query.ts

  conceptExpansionTopK:
    value: 5
    description: >-
      Phase 5: Max concepts to expand per subquery.
      Each concept may bring multiple related units.
    file: retrieval/query.ts

  conceptUnitsPerConcept:
    value: 3
    description: >-
      Phase 5: Max units to retrieve per expanded concept.
    file: retrieval/query.ts

  maxCandidates:
    value: 50
    description: >-
      Phase 5: Total candidate cap after all expansion.
      Prevents unbounded candidate pools from degrading reranking performance.
    file: retrieval/query.ts

ranking:
  weightRerank:
    value: 0.70
    description: >-
      Phase 6: Weight for max rerank score in the final ranking formula.
      The dominant signal — reranker directly measures query-document relevance.
    file: retrieval/query.ts

  weightCoverage:
    value: 0.15
    description: >-
      Phase 6: Weight for query coverage in the final ranking formula.
      Rewards candidates found by multiple sub-queries.
    file: retrieval/query.ts

  weightDirectHit:
    value: 0.10
    description: >-
      Phase 6: Weight for direct-hit status in the final ranking formula.
      Rewards candidates found via direct retrieval (not expansion).
    file: retrieval/query.ts

  weightDiversity:
    value: 0.05
    description: >-
      Phase 6: Weight for retrieval diversity in the final ranking formula.
      Rewards candidates from diverse retrieval sources (subject + content + lexical).
    file: retrieval/query.ts

rerank:
  threshold:
    value: 0.4
    description: >-
      Phase 6: Server-controlled rerank threshold.
      Candidates below this score are filtered out.
      Replaces the decomposer-controlled threshold.
    file: retrieval/query.ts

  maxResults:
    value: 12
    description: >-
      Phase 6: Maximum number of results after reranking.
      Excess candidates are filtered out.
    file: retrieval/query.ts

  fallbackTopK:
    value: 3
    description: >-
      Phase 6: If no candidates pass the rerank threshold, return the top-K
      by rerank score as a fallback (prevents empty results).
    file: retrieval/query.ts

evidence:
  budget:
    value: 8
    description: >-
      Phase 7: Soft target for evidence units passed to the answer model.
      Enough context for most queries without overwhelming the model.
    file: retrieval/evidence.ts

  maxBudget:
    value: 10
    description: >-
      Phase 7: Hard cap for evidence units. No more than this is ever passed.
    file: retrieval/evidence.ts

  comparableScoreDelta:
    value: 0.05
    description: >-
      Phase 7: When final scores differ by at most this amount, direct-hit
      status is used as a tiebreaker (prefer direct retrieval over expansion).
    file: retrieval/evidence.ts

decomposition:
  maxSubQueries:
    value: 5
    description: Maximum number of sub-queries from decomposition
    file: retrieval/decompose.ts

  fallbackRerankThreshold:
    value: 0.3
    description: Fallback rerank threshold if LLM returns invalid value
    file: retrieval/decompose.ts

sufficiency:
  maxFollowUpQueries:
    value: 5
    description: Maximum number of follow-up queries generated per sufficiency check
    file: retrieval/sufficiency.ts

router:
  fallbackRag:
    value: true
    description: >-
      If the router LLM fails, default to RAG=true (safer to do unnecessary
      retrieval than miss a real question)
    file: retrieval/router.ts

  fallbackLanguage:
    value: ru
    description: Default language if router fails
    file: retrieval/router.ts

answer:
  citationIdPattern:
    value: '[A-Z]+-\d{5}'
    description: Regex pattern for extracting unit IDs from generated answer for citation extraction
    file: retrieval/answer.ts

llm:
  jsonTemperature:
    value: 0
    description: Temperature for JSON mode LLM calls (deterministic)
    file: utils/llm.ts

  textTemperature:
    value: 0.2
    description: Temperature for text generation LLM calls (low creativity)
    file: utils/llm.ts

  defaultMaxRetries:
    value: 2
    description: Default retry count for LLM calls
    file: utils/llm.ts

prompts:
  router:
    description: >-
      System prompt for Step 1 router (8b) — RAG/chat classification +
      language detection + Russian translation
    file: retrieval/router.ts
    text: |-
      You are a query router for a tabletop RPG rules-lookup system. The rulebook is in Russian.

      Given a user message (and optional conversation history), decide:

      1. **rag**: Does this message require looking up rules in the rulebook?
         - true: questions about game mechanics, rules, stats, spells, items, interactions, etc.
         - false: greetings, thanks, follow-up requests like "rephrase that", "explain it simpler",
           "give me an example", meta-questions about the system itself, or general chat.

      2. **language**: The language code of the user's message (e.g. "ru", "uk", "en", "es").

      3. **russian_query**: Translate the user's message to Russian. If already in Russian, return it unchanged.
         This translation is used for retrieval — the rulebook is in Russian, so search works best in Russian.
         Preserve the full meaning and all mentioned terms.

      4. **chat_response** (only when rag=false): A direct response to the user's message.
         For "rephrase that" or "explain it simpler" requests, rephrase the last assistant message from
         the conversation history in simpler terms. For greetings/thanks, respond naturally.
         Respond in the user's language (matching the detected language).

      Respond with ONLY a JSON object.

  chatResponse:
    description: >-
      System prompt for direct chat response when rag=false (8b).
      Template with ${language}
    file: retrieval/router.ts
    text: |-
      You are a helpful assistant for a tabletop RPG rules-lookup system. Respond naturally in ${language}. If the user is asking about game rules, suggest they ask a specific rules question.

  decompose:
    description: >-
      System prompt for Step 2 query decomposition (70b) — breaks question into
      sub-queries + sets dynamic rerank threshold
    file: retrieval/decompose.ts
    text: |-
      You are a query decomposition engine for a tabletop RPG rules-lookup system. The rulebook is in Russian.

      Given a user's question (in Russian), break it down into focused sub-queries for vector search.

      Rules:
      - Each sub-query should target ONE specific aspect of the question.
      - Simple questions that ask about one mechanic should produce a single sub-query (the original question).
      - Complex questions about multiple interacting mechanics should be decomposed into 1-5 sub-queries.
      - Each sub-query should be a focused search phrase in Russian, optimized for semantic similarity search.
      - Sub-queries should NOT overlap too much — each should find different units.

      Also decide a **rerank_threshold** (0.0 to 1.0) based on the question type:
      - Precise lookup questions (e.g. "what is the DC for X?") → higher threshold (0.4-0.5): only return
        highly relevant results.
      - Exploratory questions (e.g. "tell me about combat mechanics") → lower threshold (0.2-0.3): return
        a broader set of relevant results.
      - Questions about interactions between mechanics → medium threshold (0.3-0.4).

      Respond with ONLY a JSON object:
      {"sub_queries": ["...", "..."], "rerank_threshold": 0.35}

  sufficiency:
    description: >-
      System prompt for Step 5 sufficiency check (70b) — structured checklist for
      coverage, interactions, contradictions, completeness
    file: retrieval/sufficiency.ts
    text: |-
      You are a sufficiency evaluator for a tabletop RPG rules-lookup system. The rulebook is in Russian.

      Given a question (in Russian) and the evidence retrieved so far (grouped by sub-query), evaluate whether
      the evidence is sufficient to answer the question completely.

      Run through this checklist systematically:

      1. **Coverage**: Does the evidence cover every mechanic, term, or concept mentioned in the question?
      2. **Interactions**: If the question asks about interactions between mechanics, is there evidence
         describing how they interact (not just definitions of each)?
      3. **Contradictions**: Are there contradictions in the evidence? If so, is there evidence that resolves
         them (e.g. an overrides/supersedes relation)?
      4. **Completeness**: Is there any aspect of the question that the evidence doesn't address at all?

      If ALL checklist items pass → sufficient: true.
      If any item fails → sufficient: false, describe the gaps, and generate focused follow-up queries
      (in Russian) to fill those gaps. Follow-up queries should be specific search phrases targeting
      the missing information.

      Respond with ONLY a JSON object:
      {"sufficient": true/false, "gaps": ["..."], "follow_up_queries": ["..."]}

  answer:
    description: >-
      System prompt for Step 6 answer generation (70b) — citation-backed answer
      from evidence
    file: retrieval/answer.ts
    text: |-
      You are a rules-lookup assistant for a tabletop RPG. You answer strictly from the
      supplied evidence (semantic units extracted from the rulebook).

      Rules you MUST follow:
      - Use only the supplied evidence. Never invent rules or fill gaps with assumptions.
      - Every factual claim must cite the unit id(s) it came from, inline, like "(RULE-00042)".
      - If two units conflict, explicitly mention the conflict and which one takes precedence if stated
        (e.g. via an "overrides"/"supersedes" relation), otherwise say the conflict is unresolved.
      - If the evidence is incomplete or ambiguous, say so explicitly instead of guessing.
      - Answer in the user's language (specified below).
      - If gaps were identified during retrieval, acknowledge what you could not find.
