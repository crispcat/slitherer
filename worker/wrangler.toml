name = "api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
EMBEDDING_MODEL = "@cf/baai/bge-m3"
EMBEDDING_DIMENSIONS = "1024"
EXTRACTION_MODEL = "@cf/zai-org/glm-4.7-flash"
REASONING_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
ANSWER_MODEL = "@cf/openai/gpt-oss-120b"
RERANK_MODEL = "@cf/baai/bge-reranker-base"
VISION_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "slitherer-rag-db"
database_id = "acca8b79-5e74-4fc4-b174-d98c650f1494"

[[vectorize]]
binding = "VECTORIZE_SUBJECTS"
index_name = "slitherer-rag-subjects"

[[vectorize]]
binding = "VECTORIZE_CONTENT"
index_name = "slitherer-rag-content"

[[vectorize]]
binding = "VECTORIZE_CONCEPTS_IDX"
index_name = "slitherer-rag-concepts-idx"

[[r2_buckets]]
bucket_name = "slitherer-rag-storage"
binding = "slitherer_rag_storage"

[[queues.producers]]
binding = "VISION_QUEUE"
queue = "vision-ingest"

[[queues.consumers]]
queue = "vision-ingest"
max_concurrency = 1
max_batch_size = 1
max_retries = 3
